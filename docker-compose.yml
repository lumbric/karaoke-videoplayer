services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
      - "4173:4173"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  build:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run build

  test:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm test
