<!DOCTYPE html>
<html>
<head>
  <title>Proxy Test</title>
</head>
<body>
  <h1>Invidious Proxy Test</h1>
  <div id="results"></div>
  <script>
    async function test() {
      const results = document.getElementById('results');
      
      // Test 1: Search Proxy
      results.innerHTML += '<h2>Test 1: Search Proxy</h2>';
      try {
        const searchResp = await fetch('/api/invidious?q=karaoke%20test&type=video&page=1');
        results.innerHTML += `<p>Status: ${searchResp.status}</p>`;
        results.innerHTML += `<p>Content-Type: ${searchResp.headers.get('content-type')}</p>`;
        const text = await searchResp.text();
        results.innerHTML += `<p>Body (first 200 chars): ${text.substring(0, 200)}</p>`;
      } catch (e) {
        results.innerHTML += `<p style="color:red">Error: ${e.message}</p>`;
      }
      
      // Test 2: Video Proxy
      results.innerHTML += '<h2>Test 2: Video Proxy</h2>';
      try {
        const videoResp = await fetch('/api/video/0/latest_version?id=test123&itag=22');
        results.innerHTML += `<p>Status: ${videoResp.status}</p>`;
        results.innerHTML += `<p>Content-Type: ${videoResp.headers.get('content-type')}</p>`;
        const text = await videoResp.text();
        results.innerHTML += `<p>Body (first 200 chars): ${text.substring(0, 200)}</p>`;
      } catch (e) {
        results.innerHTML += `<p style="color:red">Error: ${e.message}</p>`;
      }
    }
    
    test();
  </script>
</body>
</html>
